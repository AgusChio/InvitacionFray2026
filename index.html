  .card img { width: 100%; height: 150px; object-fit: cover; display: block; }
  .card div { padding: 18px; font-family: "Cinzel", serif; font-size: 1.8rem; color: var(--gold); }
  .card small { display: block; font-family: "Montserrat", sans-serif; font-size: .7rem; letter-spacing: 3px; color: #fff; text-transform: uppercase; }
